name: program-capacity

services:
  postgres:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: capacity
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d capacity']
      interval: 2s
      timeout: 3s
      retries: 30

  redpanda:
    image: redpandadata/redpanda:v26.2.4
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - '19092:19092'
    healthcheck:
      test: ['CMD-SHELL', "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 3s
      timeout: 5s
      retries: 30

  topics:
    image: redpandadata/redpanda:v26.2.4
    # Explicit topics: partitions keyed by tenant:program give per-program ordering (ADR-010).
    entrypoint: ['sh', '-c']
    command:
      - >
        rpk topic create treasury.capacity.v1 -p 6 -X brokers=redpanda:9092 || true;
        rpk topic create treasury.capacity.v1.dlq -p 1 -X brokers=redpanda:9092 || true
    depends_on:
      redpanda:
        condition: service_healthy

  console:
    image: redpandadata/console:v3.12.0
    environment:
      KAFKA_BROKERS: redpanda:9092
      # DEV-ONLY key, mounted rather than baked into the image (ADR-007)
      JWT_PUBLIC_KEY_PATH: /app/dev/jwt/public.pem
      # Lets Swagger UI on the management port call the API (dev only)
      CORS_ORIGINS: http://localhost:9464
    volumes:
      - ./dev/jwt/public.pem:/app/dev/jwt/public.pem:ro
    ports:
      - '8080:8080'
    depends_on:
      redpanda:
        condition: service_healthy

  migrate:
    build: .
    # Applies migrations then idempotent demo seed; app starts only after this succeeds.
    command: ['sh', '-c', 'node dist/database/cli.js migrate && node dist/database/cli.js seed']
    environment:
      DATABASE_URL: postgres://app:app@postgres:5432/capacity
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: development
      HTTP_PORT: 3000
      MANAGEMENT_PORT: 9464
      LOG_LEVEL: info
      DATABASE_URL: postgres://app:app@postgres:5432/capacity
      KAFKA_BROKERS: redpanda:9092
      # DEV-ONLY key, mounted rather than baked into the image (ADR-007)
      JWT_PUBLIC_KEY_PATH: /app/dev/jwt/public.pem
    volumes:
      - ./dev/jwt/public.pem:/app/dev/jwt/public.pem:ro
    ports:
      - '3000:3000'
      - '9464:9464'
    depends_on:
      migrate:
        condition: service_completed_successfully
      topics:
        condition: service_completed_successfully

volumes:
  pgdata:
